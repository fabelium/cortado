openapi: 3.1.0
info:
  title: Un cortado, por favor — API
  description: >
    Public REST seam between the Nuxt frontend and the Laravel API.
    Distinct from the engine contract in ../schema (API ↔ Python engine):
    engine payloads surface here inside job results and the sync
    search/chat bodies. Auth is Laravel Sanctum with two flows — SPA
    cookie/session (csrf-cookie + login) and Bearer tokens
    (register / tokens).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local dev (php artisan serve + php artisan queue:work)

tags:
  - name: auth
  - name: actions
    description: Synchronous engine actions (search, chat).
  - name: jobs
    description: >
      Queued engine actions (generate, transcribe, book) — POST answers
      202 with a job id; poll GET /api/jobs/{id} for the outcome.

paths:
  /sanctum/csrf-cookie:
    get:
      tags: [auth]
      summary: Prime the CSRF cookie for the SPA session flow
      description: >
        Sets the XSRF-TOKEN cookie. The SPA must echo it back as the
        X-XSRF-TOKEN header on every mutating request in the cookie flow.
      responses:
        '204':
          description: Cookie set.

  /api/register:
    post:
      tags: [auth]
      summary: Register a user (returns a Bearer token, no session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
                device_name: { type: string, maxLength: 255 }
      responses:
        '201':
          description: User created; ready-to-use Bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Throttled' }

  /api/login:
    post:
      tags: [auth]
      summary: SPA cookie/session login
      description: >
        Requires the XSRF-TOKEN cookie (GET /sanctum/csrf-cookie first) and
        the X-XSRF-TOKEN header; the request origin must be listed in
        SANCTUM_STATEFUL_DOMAINS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '204':
          description: Session established (cookie).
        '419':
          description: CSRF token missing or stale.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Throttled' }

  /api/tokens:
    post:
      tags: [auth]
      summary: Issue a Bearer token (programmatic clients)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Throttled' }

  /api/logout:
    post:
      tags: [auth]
      summary: Revoke the current token or end the session
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '204':
          description: Logged out.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/user:
    get:
      tags: [auth]
      summary: Current authenticated user
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/search:
    post:
      tags: [actions]
      summary: Search fragments (synchronous)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
                semantic: { type: boolean }
                model: { type: string, enum: [local, gemini] }
                classify: { type: boolean }
                limit: { type: [integer, 'null'], minimum: 1 }
                top_k: { type: [integer, 'null'], minimum: 1 }
                threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
      responses:
        '200':
          description: Matching fragments.
          content:
            application/json:
              schema:
                type: object
                required: [ok, fragments]
                properties:
                  ok: { const: true }
                  fragments:
                    type: array
                    items: { $ref: '#/components/schemas/Fragment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/EngineError' }

  /api/chat:
    post:
      tags: [actions]
      summary: RAG chat over selected fragments (synchronous)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, selection]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
                selection: { $ref: '#/components/schemas/Selection' }
      responses:
        '200':
          description: Grounded answer with sources.
          content:
            application/json:
              schema:
                type: object
                required: [ok, answer, sources]
                properties:
                  ok: { const: true }
                  answer: { type: string }
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/EngineError' }

  /api/generate:
    post:
      tags: [jobs]
      summary: Queue an audio generation job
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, selection]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
                selection: { $ref: '#/components/schemas/Selection' }
                options:
                  type: object
                  properties:
                    intro: { type: boolean }
                    disclaimer: { type: boolean }
                    split: { type: [integer, 'null'], minimum: 1 }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/transcribe:
    post:
      tags: [jobs]
      summary: Queue a transcription job
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selection]
              properties:
                selection:
                  type: array
                  minItems: 1
                  description: >
                    Engine-relative paths (e.g. output/clip.mp3). Absolute
                    paths and `..` traversal are rejected with 422.
                  items: { type: string, minLength: 1 }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/book:
    post:
      tags: [jobs]
      summary: Queue a book composition job
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, selection]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
                selection: { $ref: '#/components/schemas/Selection' }
                options:
                  type: object
                  properties:
                    formats:
                      type: array
                      items: { type: string, enum: [pdf, epub] }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: Poll a queued job (owner-scoped)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job state; `result` is set on done, `error`/`code` on failed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, job]
                properties:
                  ok: { const: true }
                  job: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Unknown id — or someone else's job (no existence leak).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sanctum SPA session (stateful domains + CSRF header).

  responses:
    JobAccepted:
      description: Job queued; poll GET /api/jobs/{id}.
      content:
        application/json:
          schema:
            type: object
            required: [ok, job]
            properties:
              ok: { const: true }
              job:
                type: object
                required: [id, action, status]
                properties:
                  id: { type: string, format: uuid }
                  action: { type: string, enum: [generate, transcribe, book] }
                  status: { const: queued }
    Unauthenticated:
      description: Missing or invalid credentials.
    ValidationError:
      description: Invalid input (Laravel validation error bag).
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    Throttled:
      description: Rate limited (auth endpoints are throttled 5 req/min per IP).
    EngineError:
      description: The engine reported a controlled failure.
      content:
        application/json:
          schema:
            type: object
            required: [ok, error, code]
            properties:
              ok: { const: false }
              error: { type: string }
              code:
                type: [integer, 'null']
                enum: [1, 2, 130, null]

  schemas:
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: 'Sanctum plain-text token ("id|secret").' }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }

    Selection:
      type: array
      minItems: 1
      description: Fragment ids from search. Opaque strings — do not parse.
      items: { type: string, minLength: 1 }

    Fragment:
      type: object
      description: Mirrors ../schema/response.search.schema.json items.
      required: [id, episode, date, start, end, duration, name]
      properties:
        id: { type: string, description: 'Opaque fragment id (echo back in selection).' }
        episode: { type: integer }
        date: { type: string, format: date }
        start: { type: integer }
        end: { type: [integer, 'null'] }
        duration: { type: [integer, 'null'] }
        name: { type: string }
        score: { type: [number, 'null'] }
        reason: { type: [string, 'null'] }

    Source:
      type: object
      required: [episode, date, topic]
      properties:
        episode: { type: integer }
        date: { type: string, format: date }
        topic: { type: string }

    Job:
      type: object
      required: [id, action, status, result, error, code]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [generate, transcribe, book] }
        status: { type: string, enum: [queued, running, done, failed] }
        result:
          description: >
            Full engine contract response on done (see
            ../schema/response.<action>.schema.json), e.g. result.artifacts
            for generate/book, result.transcripts for transcribe. Null until
            then.
          oneOf:
            - type: 'null'
            - type: object
        error: { type: [string, 'null'] }
        code:
          type: [integer, 'null']
          enum: [1, 2, 130, null]
